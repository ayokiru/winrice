ShortDescription: Capture, share and apply your whole Windows look with one command.
Description: |-
  winrice is dotfiles for your Windows look. It captures wallpaper, theme, accent color,
  taskbar, Explorer options, cursors, fonts and Windows Terminal settings into a small folder,
  applies setups from local folders or GitHub repositories, and backs up every change so
  `winrice rollback` restores the previous look.
