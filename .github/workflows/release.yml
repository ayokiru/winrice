name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: >-
            --remap-path-prefix=${{ github.workspace }}=winrice
            --remap-path-prefix=C:\Users\runneradmin\.cargo=cargo
            -C link-arg=/PDBALTPATH:%_PDB%
            -C link-arg=/Brepro
        run: |
          cargo build --release
          mkdir dist
          cp target/release/winrice.exe dist/
          cd dist && sha256sum winrice.exe > winrice.exe.sha256
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
