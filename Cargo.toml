[package]
name = "winrice"
version = "0.1.0"
edition = "2024"
description = "Capture, share and apply your whole Windows look with one command"
license = "MIT"
repository = "https://github.com/ayokiru/winrice"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.0"
ureq = { version = "3.5.1", default-features = false, features = ["native-tls"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
